name: Sync dashboard cache

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [main, project110, guangxi]
    steps:
      - name: Trigger Feishu snapshot sync
        run: |
          status=$(curl --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --output response.json \
            --write-out "%{http_code}" \
            "https://vercel-tk-order-dashboard.vercel.app/api/cron-sync?project=${{ matrix.project }}")
          cat response.json
          echo
          node -e "const r=require('./response.json'); if (!r.ok) process.exit(1)"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Sync request failed with HTTP $status"
            exit 1
          fi
