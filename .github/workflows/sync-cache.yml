name: Sync dashboard cache

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [main, project110, guangxi]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Sync Feishu snapshot to Blob
        run: node scripts/sync-cache.js "${{ matrix.project }}"
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_MAIN_VIEW_ID: ${{ secrets.FEISHU_MAIN_VIEW_ID }}
          FEISHU_PROJECT_110_VIEW_ID: ${{ secrets.FEISHU_PROJECT_110_VIEW_ID }}
          FEISHU_GUANGXI_VIEW_ID: ${{ secrets.FEISHU_GUANGXI_VIEW_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DASHBOARD_CACHE_SECRET: ${{ secrets.DASHBOARD_CACHE_SECRET }}
          DASHBOARD_CACHE_PREFIX: tk-order-dashboard
          DASHBOARD_TIME_ZONE: Asia/Shanghai
          PRODUCT_TRANSLATION_ENABLED: "true"
          PRODUCT_TRANSLATION_SYNC_LIMIT: "0"